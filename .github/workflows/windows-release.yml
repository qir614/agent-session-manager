name: windows-exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build single-file Windows application
        shell: pwsh
        run: .\windows\build.ps1 -Clean
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath dist\AgentSessionManager.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AgentSessionManager.exe" | Set-Content -LiteralPath dist\AgentSessionManager.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: AgentSessionManager-windows-x64
          path: |
            dist/AgentSessionManager.exe
            dist/AgentSessionManager.exe.sha256
          if-no-files-found: error
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag dist\AgentSessionManager.exe dist\AgentSessionManager.exe.sha256 --clobber
