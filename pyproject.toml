[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-local-session-cleaner"
version = "0.6.0"
description = "Graphical local Codex session manager with dependency-aware operations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Codex Local Session Cleaner contributors" }]
keywords = ["codex", "session", "cleanup", "sqlite", "jsonl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.scripts]
codex-session-cleaner = "codex_session_cleaner.cli:main"
codex-session-cleaner-gui = "codex_session_cleaner.gui:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.14,<7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
