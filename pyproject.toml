[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-session-manager"
version = "2026.10.29"
description = "Local session manager and cleaner for Codex and DSH conversation data with independent application adapters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agent Session Manager contributors" }]
keywords = ["agent", "session-manager", "codex", "dsh", "session", "cleanup", "sqlite", "jsonl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.scripts]
agent-session-manager = "agent_session_manager.cli:main"
agent-session-manager-gui = "agent_session_manager.gui:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.14,<7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
